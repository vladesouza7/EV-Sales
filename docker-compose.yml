services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: evsales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evsales}
      POSTGRES_DB: evsales
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/criar-banco-de-teste.sql:/docker-entrypoint-initdb.d/10-teste.sql:ro
      - ./scripts/criar-banco-evolution.sql:/docker-entrypoint-initdb.d/20-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evsales"]
      interval: 5s
      retries: 10

  # ADR-013. A porta é publicada em dev pelo mesmo motivo que a do postgres: o
  # `subir-dev.sh` roda o uvicorn fora do compose. No perfil `prod` os dois ficam atrás
  # do nginx. O que protege o Espelho não é a porta fechada — é o bucket privado e a
  # validação de prefixo na única rota que recebe nome vindo de fora.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${EVSALES_MINIO_ACCESS_KEY:-evsales}
      MINIO_ROOT_PASSWORD: ${EVSALES_MINIO_SECRET_KEY:-evsales-local}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      retries: 10

  # ADR-005 e S-10 §1 — o gateway do WhatsApp. Roda aqui dentro, e não numa instância
  # hospedada, porque a mensagem do cliente atravessa este container: mantê-lo no servidor
  # da loja é o mesmo argumento que o ADR-012 usou para tirar a conversa do intermediário.
  #
  # A `AUTHENTICATION_API_KEY` é lida pelo container **no boot**, do `.env`. A tela da S-12
  # guarda uma cópia dela para falar com este serviço; se as duas divergirem, a sonda do
  # `PUT /api/configuracoes` responde 401 e recusa gravar — que é o comportamento certo.
  #
  # Nomes conferidos contra a imagem v2.3.7, subindo o container: o Prisma conecta no banco
  # `evolution`, o HTTP sobe na 8080, `fetchInstances` responde 200 com a chave e 401 sem.
  evolution:
    image: evoapicloud/evolution-api:latest
    env_file: .env
    environment:
      SERVER_URL: ${EVSALES_EVOLUTION_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVSALES_EVOLUTION_CHAVE:?defina EVSALES_EVOLUTION_CHAVE no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evsales:${POSTGRES_PASSWORD:-evsales}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      # Sem Redis: ele é da S-10 §1 e ainda não subiu. O cache local resolve para uma loja.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    ports: ["8080:8080"]
    # Em dev o `subir-dev.sh` roda o uvicorn FORA do compose, no host. Sem esta linha,
    # `localhost` dentro do container é o próprio container, e o webhook da S-06 nunca
    # chega na API — o sintoma é "a Aurora não responde no WhatsApp" sem erro nenhum.
    # No perfil `prod` a api sobe no compose e o destino vira `http://api:8000`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # A sessão do WhatsApp. Perder este volume é ler o QR code de novo (S-10 §5).
      - evolution_instancias:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      EVSALES_DATABASE_URL: postgresql+psycopg://evsales:${POSTGRES_PASSWORD:-evsales}@postgres:5432/evsales
      EVSALES_MINIO_ENDPOINT: minio:9000
      # Dentro da rede do compose o gateway é o nome do serviço. Continua sendo bootstrap:
      # o que a tela gravar vence isto (ADR-014).
      EVSALES_EVOLUTION_URL: http://evolution:8080
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  evolution_instancias:
