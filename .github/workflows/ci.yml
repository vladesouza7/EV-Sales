# S-10 §7 — o que bloqueia merge. Sem este arquivo os portões rodavam na máquina de quem
# escreveu o código, que é o mesmo que não rodar (docs/spec/README.md).
#
# Os serviços são os do próprio `docker-compose.yml`: definir postgres e minio outra vez
# aqui criaria uma segunda verdade, e é a segunda que envelhece.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# O passo dos evals fala com o provedor de verdade e é a única coisa aqui que custa
# dinheiro por execução. Push novo na mesma branch cancela a corrida anterior: sem isto,
# três commits seguidos pagam três vezes pela mesma resposta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portoes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Sem pin de versão: o uv resolve pelo `requires-python` do pyproject, igual à
          # máquina de quem desenvolve. Pin aqui seria testar um interpretador que ninguém usa.
          enable-cache: true

      - name: Postgres e MinIO
        working-directory: .
        run: |
          cp .env.example .env
          # Também exercita o script da S-10 §2 — e a Evolution exige a chave dela para o
          # compose sequer interpolar, o que é o modo certo de falhar.
          ./scripts/gerar-segredos.sh
          # O volume do postgres nasce com a senha do `.env`, e a suíte conecta pela URL
          # padrão do `conftest` — `evsales:evsales`. Sem esta linha o container sobe com o
          # placeholder `troque-esta-senha` do `.env.example` e **todos** os testes falham
          # na autenticação. É a mesma troca que o `subir-dev.sh` faz na máquina de quem
          # desenvolve, pelo mesmo motivo; o placeholder existe para o humano trocar.
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=evsales|' .env
          docker compose up -d postgres minio
          timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U evsales; do sleep 1; done'
          timeout 120 bash -c 'until curl -sf localhost:9000/minio/health/live; do sleep 1; done'

      - run: uv run ruff check .

      # Só `app`: a suíte ainda não passa no strict, e ligar isso aqui seria trocar o
      # portão por 16 erros pré-existentes. Está no ledger, não subentendido.
      # ponytail: `mypy tests` quando os 16 erros de tipo da suíte forem limpos.
      - run: uv run mypy app

      - name: Migrations sobem e descem
        # Num banco descartável, nunca no `evsales`. Aqui o runner é limpo e daria na
        # mesma; o script existe para que o comando do CI e o da máquina de quem
        # desenvolve sejam o MESMO — foi rodando isto à mão no banco errado que eu
        # derrubei um ambiente de desenvolvimento.
        working-directory: .
        run: ./scripts/conferir-migrations.sh

      # Os portões primeiro: se um deles cai, é a primeira linha vermelha do relatório.
      - name: "Portão — concorrência de reserva (S-05)"
        run: uv run pytest -q tests/test_reserva.py::test_cinquenta_simultaneas_exatamente_uma_vence

      - name: "Portão — varredura de PII nos logs (S-09 §7)"
        run: uv run pytest -q tests/test_varredura_pii.py

      # Os três portões da S-03 §8, num passo só: o relatório do `rodar.py` dá o veredito
      # de cada suíte separado, e três passos aqui pediriam a mesma configuração três
      # vezes — o GitHub não aceita âncora de YAML para reaproveitar `env`.
      #
      # Este passo fala com o provedor de verdade, e é a única coisa no CI que custa
      # dinheiro. Sem `EVSALES_LLM_API_KEY` no repositório ele **reprova**, não pula:
      # portão que se pula quando falta credencial é decoração (docs/spec/README.md).
      #
      # 5 minutos, e não 3: são 28 conversas com o modelo de verdade, e o runner as roda
      # `EVSALES_EVAL_PARALELO` por vez (8, o padrão do `rodar.py`). O tempo de parede fica
      # em poucos minutos, mas quem manda nele é a latência do provedor, que não é nossa —
      # o limite aqui existe para matar corrida pendurada, não para apertar o portão. Um
      # limite curto demais reprova por relógio e não por comportamento, que é o pior tipo
      # de vermelho: o portão passa a medir a fila do provedor em vez da fala da Aurora.
      - name: "Portões — evals da Aurora: preço, autonomia e injection (S-03 §8)"
        # 4 minutos era curto: na primeira execução com o modelo v3.1, `preco` levou 54s e
        # `autonomia` 43s, e o relógio estourou com `injection` no meio — a suíte mais
        # importante das três ficou SEM VEREDITO, que é pior do que reprovar. O eval em si
        # roda em ~3 min com paralelismo 8; o que varia é a fila do provedor, não o código.
        # 15 min dá folga para essa variação e ainda mata job pendurado antes de virar
        # conta. Se um dia bater neste limite, o problema é o provedor, não a Aurora.
        timeout-minutes: 15
        env:
          EVSALES_PROVEDOR: ${{ vars.EVSALES_PROVEDOR || 'openrouter' }}
          # Sem esta linha, `EVSALES_PROVEDOR=ollama` cai no preset `http://localhost:11434`
          # e o eval morre em conexão recusada — não existe Ollama no runner. Vazia, o
          # preset do provedor vence, que é o comportamento do `provedor.py`.
          EVSALES_LLM_URL: ${{ vars.EVSALES_LLM_URL || 'https://openrouter.ai/api/v1' }}
          # O modelo que os portões medem é decisão, não acaso — e ela fica aqui, no
          # arquivo, e não só em `vars`: a variável do repositório sumiu entre duas
          # corridas e o eval caiu no fallback sem ninguém pedir, medindo um modelo
          # diferente com os mesmos casos. Resultado de eval depende do modelo, e portão
          # que troca de régua sozinho não compara com o de ontem.
          EVSALES_MODELO: ${{ vars.EVSALES_MODELO || 'deepseek/deepseek-chat-v3.1' }}
          EVSALES_LLM_API_KEY: ${{ secrets.EVSALES_LLM_API_KEY }}
          EVSALES_DOLAR_CENTAVOS: ${{ vars.EVSALES_DOLAR_CENTAVOS || '550' }}
          # Teto de 15 no `rodar.py` — é o tamanho do pool de conexões do `app.db`, e cada
          # conversa segura uma. Subir isto encurta o passo, mas aproxima o 429 do provedor,
          # que reprova caso bom por limite de taxa; 8 é o padrão conservador do runner, e
          # mexer nele é `vars.EVSALES_EVAL_PARALELO`, medindo antes e depois.
          EVSALES_EVAL_PARALELO: ${{ vars.EVSALES_EVAL_PARALELO || '8' }}
        run: uv run python -m evals.rodar preco autonomia injection

      # ponytail: falta a cobertura ≥70% no core. Entra aqui quando alguém medir; o
      # estado está escrito em docs/spec/README.md, não subentendido num passo comentado.
      - run: uv run pytest -q
