<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV-Sales · Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
/* ═══ Tokens — paleta completa do tema claro no :root ═══════════════════ */
:root{
  --ground:#F1F3F7; --surface:#FFFFFF; --surface-2:#E9ECF3;
  --ink:#101B2E; --ink-2:#3D4A63; --muted:#69758F; --line:#D7DDE8;
  --sol:#C26A14; --sol-soft:#FBEEDD;
  --volt:#0A6E7D; --volt-soft:#DDEFF2;
  --ok:#2A7A55; --ok-soft:#DBEEE3;
  --warn:#8D5D07; --warn-soft:#F9EED3;
  --crit:#AB2E26; --crit-soft:#FAE2E0;
  --rail:#101B2E; --rail-ink:#C6D0E4; --rail-line:#233250;
  --shadow:0 1px 2px rgba(16,27,46,.06), 0 10px 26px -16px rgba(16,27,46,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1220; --surface:#141D2D; --surface-2:#1D2839;
    --ink:#E7ECF6; --ink-2:#B7C2D7; --muted:#8694AE; --line:#27344B;
    --sol:hsl(32 82% 62%); --sol-soft:hsl(32 40% 16%);
    --volt:hsl(189 56% 54%); --volt-soft:hsl(189 45% 14%);
    --ok:hsl(152 42% 56%); --ok-soft:hsl(152 35% 13%);
    --warn:hsl(40 72% 58%); --warn-soft:hsl(40 40% 15%);
    --crit:hsl(6 78% 66%); --crit-soft:hsl(6 42% 17%);
    --rail:hsl(215 48% 7%); --rail-ink:hsl(215 30% 78%); --rail-line:hsl(215 32% 18%);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1220; --surface:#141D2D; --surface-2:#1D2839;
  --ink:#E7ECF6; --ink-2:#B7C2D7; --muted:#8694AE; --line:#27344B;
  --sol:hsl(32 82% 62%); --sol-soft:hsl(32 40% 16%);
  --volt:hsl(189 56% 54%); --volt-soft:hsl(189 45% 14%);
  --ok:hsl(152 42% 56%); --ok-soft:hsl(152 35% 13%);
  --warn:hsl(40 72% 58%); --warn-soft:hsl(40 40% 15%);
  --crit:hsl(6 78% 66%); --crit-soft:hsl(6 42% 17%);
  --rail:hsl(215 48% 7%); --rail-ink:hsl(215 30% 78%); --rail-line:hsl(215 32% 18%);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
}

/* ═══ Base ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:Archivo,"Segoe UI",system-ui,sans-serif; text-wrap:balance; margin:0}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--sol); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
.lbl{font-family:Archivo,sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.09em;
     text-transform:uppercase; color:var(--muted)}
.hide-sm{display:none}
@media(min-width:900px){.hide-sm{display:block}}


/* ═══ Seleção de papel ══════════════════════════════════════════════════ */
.gate{min-height:100dvh; display:grid; place-items:center; padding:32px 20px}
.gate-inner{width:100%; max-width:880px; display:flex; flex-direction:column; gap:26px}
.brand{display:flex; align-items:center; gap:14px}
.brand-mark{width:46px; height:46px; border-radius:13px; background:var(--rail); display:grid;
  place-items:center; color:var(--sol); flex:none}
.brand h1{font-size:23px; font-weight:700; letter-spacing:-.015em}
.brand p{margin:2px 0 0; font-size:13.5px; color:var(--muted)}
.roles{display:grid; gap:14px; grid-template-columns:1fr}
@media(min-width:760px){.roles{grid-template-columns:repeat(3,1fr)}}
.role{display:flex; flex-direction:column; gap:9px; text-align:left; padding:20px;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); transition:transform .16s, border-color .16s}
.role:hover{transform:translateY(-3px); border-color:var(--sol)}
.role .who{font-family:Archivo,sans-serif; font-weight:700; font-size:16.5px}
.role .what{font-size:13.5px; color:var(--ink-2); line-height:1.5}
.role .sees{font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:9px}
.gate-note{font-size:12.5px; color:var(--muted); max-width:64ch; line-height:1.6}

/* ═══ Shell ═════════════════════════════════════════════════════════════ */
.shell{min-height:100dvh; display:flex; flex-direction:column}
@media(min-width:900px){.shell{flex-direction:row}}
.rail{background:var(--rail); color:var(--rail-ink); display:flex; flex-direction:column; flex:none}
@media(min-width:900px){.rail{width:238px; height:100dvh; position:sticky; top:0}}
.rail-top{padding:18px 18px 14px; border-bottom:1px solid var(--rail-line);
  display:flex; align-items:center; gap:11px}
.rail-top .nm{font-family:Archivo,sans-serif; font-weight:700; color:#fff; font-size:15.5px}
.rail-top .sub{font-size:11px; opacity:.72}
.nav{display:flex; gap:4px; padding:12px; overflow-x:auto; flex:1}
@media(min-width:900px){.nav{flex-direction:column; overflow-x:visible; overflow-y:auto}}
.nav button{display:flex; align-items:center; gap:10px; padding:9px 12px; border:0; border-radius:9px;
  background:transparent; color:var(--rail-ink); font-size:14px; white-space:nowrap; text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.15); color:#fff; font-weight:600}
.nav .pill{margin-left:auto; background:var(--sol); color:#16100A; font-size:11px; font-weight:700;
  border-radius:99px; padding:1px 7px; font-family:"IBM Plex Mono",monospace}
.rail-foot{padding:12px; border-top:1px solid var(--rail-line); display:flex; gap:8px}
.rail-foot button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:8px; border:0; border-radius:8px; background:rgba(255,255,255,.09);
  color:var(--rail-ink); font-size:12.5px}
.rail-foot button:hover{background:rgba(255,255,255,.17)}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:19px 20px 15px; border-bottom:1px solid var(--line); background:var(--surface)}
.topbar h2{font-size:19px; font-weight:700; letter-spacing:-.01em}
.topbar .sub{font-size:13px; color:var(--muted); margin-top:2px}
.body-pad{padding:20px; display:flex; flex-direction:column; gap:18px}

/* ═══ Peças ═════════════════════════════════════════════════════════════ */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:13px}
.panel-h{padding:13px 16px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; justify-content:space-between; gap:12px}
.panel-h h3{font-size:14.5px; font-weight:600}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 13px;
  border-radius:9px; border:1px solid transparent; font-family:Archivo,sans-serif; font-size:13px;
  font-weight:600; background:var(--sol); color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); filter:none}
.btn.sm{padding:5px 10px; font-size:12px}
.tag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px;
  font-size:11.5px; font-weight:600; font-family:Archivo,sans-serif; white-space:nowrap}
.tag.ok{background:var(--ok-soft); color:var(--ok)}
.tag.warn{background:var(--warn-soft); color:var(--warn)}
.tag.crit{background:var(--crit-soft); color:var(--crit)}
.tag.volt{background:var(--volt-soft); color:var(--volt)}
.tag.sol{background:var(--sol-soft); color:var(--sol)}
.tag.mut{background:var(--surface-2); color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{font-family:Archivo,sans-serif; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); text-align:left; padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.tiles{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:15px 17px}
.tile .v{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:500;
  letter-spacing:-.025em; margin-top:5px; display:block}
.tile .n{font-size:12px; color:var(--muted); margin-top:3px}
.banner{display:flex; gap:11px; align-items:flex-start; padding:13px 15px; border-radius:11px;
  font-size:13.5px; line-height:1.5; background:var(--volt-soft); color:var(--volt)}
.banner.sol{background:var(--sol-soft); color:var(--sol)}
.banner.crit{background:var(--crit-soft); color:var(--crit)}
.banner b{font-family:Archivo,sans-serif}
.empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:13.5px}

/* ═══ Atendimento: conversa | o que o sistema fez ═══════════════════════ */
.split{display:grid; grid-template-columns:1fr; flex:1; min-height:0}
@media(min-width:1060px){.split{grid-template-columns:minmax(0,1fr) 348px}}
.conv{display:flex; flex-direction:column; min-height:0; min-width:0}
.stream{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:13px;
  max-height:min(58dvh,540px)}
@media(min-width:1060px){.stream{max-height:none}}
.msg{max-width:min(62ch,88%); display:flex; flex-direction:column; gap:4px}
.msg.cli{align-self:flex-end; align-items:flex-end}
.bub{padding:10px 14px; border-radius:14px; font-size:14.5px; line-height:1.55; white-space:pre-wrap}
.msg.aur .bub{background:var(--surface); border:1px solid var(--line); border-top-left-radius:5px}
.msg.cli .bub{background:var(--rail); color:#EDF1F8; border-top-right-radius:5px}
.msg .who{font-size:11px; color:var(--muted); padding:0 4px}
.msg .who strong{color:var(--sol); font-weight:600}
.sysline{align-self:flex-start; display:flex; align-items:flex-start; gap:8px; font-size:12px;
  font-family:"IBM Plex Mono",monospace; color:var(--volt); background:var(--volt-soft);
  border-radius:8px; padding:5px 10px; max-width:100%; line-height:1.45}
.sysline.pause{color:var(--sol); background:var(--sol-soft)}
.sysline.block{color:var(--crit); background:var(--crit-soft)}
.compose{border-top:1px solid var(--line); background:var(--surface); padding:12px 16px 14px;
  display:flex; flex-direction:column; gap:10px}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{padding:6px 11px; border-radius:99px; border:1px solid var(--line); background:transparent;
  font-size:12.5px; color:var(--ink-2); text-align:left}
.chip:hover{border-color:var(--sol); color:var(--sol)}
.chip.risk{border-style:dashed; color:var(--crit); border-color:var(--crit)}
.entry{display:flex; gap:9px}
.entry input{flex:1; min-width:0; padding:10px 13px; border-radius:10px; border:1px solid var(--line);
  background:var(--ground); color:var(--ink); font:inherit; font-size:14px}
.entry input::placeholder{color:var(--muted)}
.aside{border-top:1px solid var(--line); background:var(--surface); display:flex;
  flex-direction:column; min-height:0}
@media(min-width:1060px){.aside{border-top:0; border-left:1px solid var(--line)}}
.aside-h{padding:14px 16px 11px; border-bottom:1px solid var(--line)}
.aside-h p{margin:5px 0 0; font-size:12px; color:var(--muted); line-height:1.5}
.trace{flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:9px;
  max-height:340px}
.tr{display:flex; gap:9px; font-size:12.5px; line-height:1.45}
.tr .ic{flex:none; width:16px; text-align:center; font-family:"IBM Plex Mono",monospace; color:var(--volt)}
.tr.pause .ic{color:var(--sol)}
.tr.block .ic{color:var(--crit)}
.tr.done .ic{color:var(--ok)}
.tr .nm{font-family:"IBM Plex Mono",monospace; color:var(--ink); word-break:break-word}
.tr .dt{color:var(--muted); font-size:11.5px}
.meters{border-top:1px solid var(--line); padding:13px 16px; display:flex; flex-direction:column; gap:11px}
.meter .row{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; gap:10px}
.meter .row b{font-family:"IBM Plex Mono",monospace; font-weight:500}
.bar{height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:5px}
.bar span{display:block; height:100%; background:var(--ok); border-radius:99px}
.bar span.warn{background:var(--warn)}
.bar span.crit{background:var(--crit)}

/* ═══ Fila da Neuza — decidir em 30s, no celular, com o polegar ═════════ */
.queue{display:grid; gap:14px; grid-template-columns:1fr}
@media(min-width:780px){.queue{grid-template-columns:repeat(auto-fill,minmax(322px,1fr))}}
.appr{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--sol);
  border-radius:13px; padding:17px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow)}
.appr .hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.appr .nome{font-family:Archivo,sans-serif; font-weight:700; font-size:15.5px}
.appr .age{font-size:12px; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.appr .car{font-size:14.5px; font-weight:600}
.appr .chassi{font-size:12.5px; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.appr .preco{font-family:"IBM Plex Mono",monospace; font-size:25px; font-weight:500; letter-spacing:-.02em}
.appr .qual{font-size:13px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:11px; line-height:1.5}
.appr .acts{display:flex; gap:9px}
.appr .acts .btn{flex:1; min-height:46px}

/* ═══ Ler atendimento ═══════════════════════════════════════════════════ */
.audit{display:flex; flex-direction:column; gap:2px; padding:9px}
.arow{display:grid; grid-template-columns:50px 1fr; gap:11px; padding:7px 11px;
  border-radius:8px; font-size:13.5px; align-items:baseline}
@media(min-width:640px){.arow{grid-template-columns:50px 82px 1fr}}
.arow .t{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted)}
.arow .a{font-family:Archivo,sans-serif; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.arow.sys{background:var(--volt-soft); color:var(--volt); font-family:"IBM Plex Mono",monospace; font-size:12.5px}
.arow.sys .a{color:var(--volt)}
.arow.hum{background:var(--sol-soft); color:var(--sol)}
.arow.hum .a{color:var(--sol)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ═══════════════════════════════════════════════════════════════════════
   EV-Sales — protótipo navegável
   Sol & Volt Veículos Elétricos · Tambaú, João Pessoa/PB

   A Aurora aqui é DETERMINÍSTICA, por roteiro. Não há chamada de LLM e não
   há chave de API neste arquivo: chave em HTML estático fica exposta para
   quem abrir a página. Para demonstrar guardrail isso é até melhor — dá
   para forçar o caso de erro na frente de quem assiste.

   Chassis, CNPJ e valores são fictícios.
   ═══════════════════════════════════════════════════════════════════════ */

const brl = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const km  = n => n.toLocaleString('pt-BR');
const agora = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

/* ── Estoque: unidade com chassi, nunca SKU com quantidade (ADR-001) ──── */
const ESTOQUE_SEED = [
  {chassi:'9BW…4471', marca:'BYD',       modelo:'Seal',        versao:'Premium',  ano:'2026', cor:'Branco', condicao:'novo',     km:0,     preco:24999000, aut:372, fonte:'INMETRO', cat:'intermediario', status:'disponivel'},
  {chassi:'9BW…9902', marca:'BYD',       modelo:'Seal',        versao:'Premium',  ano:'2026', cor:'Cinza',  condicao:'novo',     km:0,     preco:24999000, aut:372, fonte:'INMETRO', cat:'intermediario', status:'disponivel'},
  {chassi:'9BW…1180', marca:'BYD',       modelo:'Dolphin',     versao:'GS',       ano:'2026', cor:'Branco', condicao:'novo',     km:0,     preco:14999000, aut:291, fonte:'INMETRO', cat:'urbano',        status:'disponivel'},
  {chassi:'9BW…3307', marca:'BYD',       modelo:'Dolphin Mini',versao:'GL',       ano:'2026', cor:'Prata',  condicao:'novo',     km:0,     preco:11890000, aut:280, fonte:'INMETRO', cat:'urbano',        status:'disponivel'},
  {chassi:'LGW…7742', marca:'GWM',       modelo:'Ora 03',      versao:'Skin',     ano:'2026', cor:'Azul',   condicao:'novo',     km:0,     preco:16900000, aut:250, fonte:'INMETRO', cat:'urbano',        status:'disponivel'},
  {chassi:'LC0…5518', marca:'GAC Aion',  modelo:'Aion Y Plus', versao:'Premium',  ano:'2026', cor:'Preto',  condicao:'novo',     km:0,     preco:19990000, aut:317, fonte:'INMETRO', cat:'intermediario', status:'disponivel'},
  {chassi:'YV1…6620', marca:'Volvo',     modelo:'EX30',        versao:'Plus',     ano:'2025', cor:'Cinza',  condicao:'seminovo', km:12400, preco:21990000, aut:250, fonte:'INMETRO', cat:'intermediario', status:'disponivel'},
  {chassi:'KMH…8834', marca:'Hyundai',   modelo:'Ioniq 6',     versao:'RWD',      ano:'2025', cor:'Branco', condicao:'seminovo', km:8900,  preco:48900000, aut:614, fonte:'WLTP',    cat:'longo_alcance', status:'disponivel'},
  {chassi:'5YJ…2094', marca:'Tesla',     modelo:'Model 3',     versao:'Long Range',ano:'2024',cor:'Azul',   condicao:'seminovo', km:31200, preco:32900000, aut:580, fonte:'WLTP',    cat:'longo_alcance', status:'disponivel'},
  {chassi:'WP0…0071', marca:'Porsche',   modelo:'Taycan',      versao:'4S',       ano:'2023', cor:'Preto',  condicao:'seminovo', km:22800, preco:86900000, aut:484, fonte:'WLTP',    cat:'longo_alcance', status:'disponivel'}
];

const T = {
  tool:  (nm,dt)=>({k:'tool',  nm, dt}),
  ok:    (nm,dt)=>({k:'done',  nm, dt}),
  pause: (nm,dt)=>({k:'pause', nm, dt}),
  block: (nm,dt)=>({k:'block', nm, dt})
};

/* ── O roteiro. Cada passo: o que a Aurora diz, o que o sistema fez, e as
      respostas possíveis. A etapa define quais tools existem (S-02 §2). ── */
const PASSOS = {
  abertura: {
    etapa:'saudacao', custo:0.004,
    aurora:'Oi, Tarcísio! Sou a Aurora, consultora da Sol & Volt aqui de Tambaú.\n\nMe conta o que você procura que eu já vejo o que temos na loja hoje — com preço e disponibilidade de verdade, não tabela desatualizada.',
    trace:[],
    chips:[
      {t:'Quero um elétrico até 150 mil, pra cidade', ir:'qualifica'},
      {t:'Vocês têm Tesla zero?', ir:'tesla'},
      {t:'Quanto custa o Seal branco? Tem pronta entrega?', ir:'apressado'}
    ]
  },

  qualifica: {
    etapa:'qualificacao', custo:0.006,
    aurora:'Ótimo, dá pra fazer coisa boa nessa faixa.\n\nUma pergunta só antes de eu te mostrar: quantos quilômetros você roda por dia, mais ou menos? É que isso muda bastante a recomendação.',
    trace:[T.tool('registrar_qualificacao({orcamento_max: 150000, uso: "cidade"})','12ms')],
    chips:[
      {t:'Uns 40 km. Manaíra até o Centro e volta', ir:'recomenda'},
      {t:'Rodo bastante, umas viagens pra Recife também', ir:'recomenda'}
    ]
  },

/* ── Estado compartilhado entre abas (para demonstrar a corrida) ───────── */
const LS = {
  get(k,fb){ try{ const v=localStorage.getItem('evsales:'+k); return v?JSON.parse(v):fb }catch(e){ return fb } },
  set(k,v){ try{ localStorage.setItem('evsales:'+k,JSON.stringify(v)) }catch(e){} }
};

/* A corrida do ADR-001, em JS: lê o estado fresco e só grava se ainda
   estiver disponível. É o análogo do UPDATE … WHERE status='disponivel'. */
function reservarChassi(chassi, lead){
  const est = LS.get('estoque', ESTOQUE_SEED);
  const u = est.find(x => x.chassi === chassi);
  if(!u || u.status !== 'disponivel') return false;
  u.status = 'reservado'; u.para = lead; u.em = Date.now();
  LS.set('estoque', est);
  return true;
}

/* ── Motor do roteiro ─────────────────────────────────────────────────── */
const convVazia = () => ({msgs:[], trace:[], etapa:'saudacao', passo:null, custo:0, chassi:null, chips:[], turnos:0});

function aplicar(conv, id, falaCliente, alucinar){
  const p = PASSOS[id];
  const c = {...conv, msgs:[...conv.msgs], trace:[...conv.trace]};
  const h = agora();
  if(falaCliente){ c.msgs.push({de:'cliente', txt:falaCliente, hora:h}); c.turnos++; }
  if(!p) return c;

  const extras = [];
  if(alucinar && /\d/.test(p.aurora)){
    c.msgs.push({de:'sys', tipo:'block', txt:'1 resposta descartada: a Aurora escreveu "cerca de 400 km" e o banco diz 291. Regenerada.'});
    extras.push({k:'block', nm:'verificação numérica: 400 km não confere → mensagem bloqueada', dt:'9ms'});
    extras.push({k:'done',  nm:'turno regenerado (1ª e única tentativa)', dt:'1.1s'});
    c.custo += 0.009;
  }

  c.msgs.push({de:'aurora', txt:p.aurora, hora:h});
  const mi = c.msgs.length - 1;   // âncora: a mensagem que este trace produziu
  extras.forEach(t => c.trace.push({...t, hora:h, mi}));
  (p.trace||[]).forEach(t => c.trace.push({...t, hora:h, mi}));
  c.etapa = p.etapa; c.passo = id; c.chips = p.chips||[];
  c.custo = +(c.custo + (p.custo||0)).toFixed(4);
  return c;
}

function conversaInicial(){
  let c = convVazia();
  c = aplicar(c,'abertura',null,false);
  c = aplicar(c,'qualifica','Quero um elétrico até 150 mil, pra cidade',false);
  c = aplicar(c,'recomenda','Uns 40 km. Manaíra até o Centro e volta',false);
  return c;
}

/* ── Atendimento: a conversa e o que o sistema fez, lado a lado ────────── */
const Atendimento = ({conv, setConv, estoque, pedirAprovacao, alucinar, setAlucinar, reiniciar}) => {
  const [txt, setTxt] = useState('');
  const fim = useRef(null);
  useEffect(()=>{ if(fim.current) fim.current.scrollIntoView({block:'end'}); }, [conv.msgs.length]);

  const ir = (id, fala) => {
    const p = PASSOS[id];
    if(p && p.redirect === 'PEDIR_APROVACAO'){
      const u = estoque.find(x => x.chassi === p.chassi);
      let c = {...conv, msgs:[...conv.msgs, {de:'cliente', txt:fala, hora:agora()}], turnos:conv.turnos+1};
      c = aplicar(c, 'aguardando', null, false);
      c.chassi = p.chassi;
      setConv(c);
      pedirAprovacao(p.chassi, u ? u.preco : 0);
      return;
    }
    setConv(aplicar(conv, id, fala, alucinar));
    if(alucinar) setAlucinar(false);
  };

  const enviar = e => {
    e.preventDefault();
    const q = txt.trim(); if(!q) return;
    setTxt('');
    const alvo = (conv.chips||[]).find(ch => {
      const a = ch.t.toLowerCase(), b = q.toLowerCase();
      return a.includes(b.slice(0,12)) || b.split(/\s+/).some(w => w.length>4 && a.includes(w));
    });
    if(alvo) return ir(alvo.ir, q);
    const c = {...conv, msgs:[...conv.msgs,
      {de:'cliente', txt:q, hora:agora()},
      {de:'sys', tipo:'block', txt:'Este protótipo responde por roteiro. Use uma das sugestões abaixo para seguir a demonstração.'}
    ]};
    setConv(c);
  };

  const pctCusto = Math.min(100, (conv.custo/0.45)*100);
  const nivel = conv.custo > 0.45 ? 'crit' : conv.custo > 0.32 ? 'warn' : '';

  return (
    <div className="split">
      <div className="conv">
        <div className="stream">
          {conv.msgs.map((m,i) => m.de==='sys' ? (
            <div key={i} className={'sysline '+(m.tipo||'')}>
              <span>{m.tipo==='block'?'⛔':'⚙'}</span><span>{m.txt}</span>
            </div>
          ) : (
            <div key={i} className={'msg '+(m.de==='cliente'?'cli':'aur')}>
              <div className="bub">{m.txt}</div>
              <div className="who">
                {m.de==='cliente' ? 'Tarcísio' : <><strong>Aurora</strong> · assistente</>} · {m.hora}
              </div>
            </div>
          ))}
          <div ref={fim}/>
        </div>

        <div className="compose">
          {conv.etapa==='aguardando_aprovacao' && (
            <div className="banner sol">
              <span>⏸</span>
              <span><b>Fluxo pausado.</b> A Aurora está sem nenhuma tool disponível nesta etapa.
              Entre como <b>Neuza</b> para decidir — é o que destrava a reserva.</span>
            </div>
          )}
          {conv.chips.length > 0 && (
            <div className="chips">
              {conv.chips.map((ch,i) => (
                <button key={i} className={'chip'+(ch.risco?' risk':'')} onClick={()=>ir(ch.ir, ch.t)}>{ch.t}</button>
              ))}
            </div>
          )}
          <form className="entry" onSubmit={enviar}>
            <input value={txt} onChange={e=>setTxt(e.target.value)}
              placeholder={conv.etapa==='encerrada' ? 'Conversa encerrada' : 'Escreva para a Aurora…'}
              disabled={conv.etapa==='encerrada'} aria-label="Mensagem para a Aurora"/>
            <button className="btn" type="submit" disabled={conv.etapa==='encerrada'}>Enviar</button>
          </form>
        </div>
      </div>

      <aside className="aside">
        <div className="aside-h">
          <div className="lbl">O que o sistema fez</div>
          <p>O modelo escolhe as palavras. Cada linha aqui é o código decidindo o que pode ser feito.</p>
        </div>

        <div className="trace">
          {conv.trace.length===0 && <div className="empty" style={{padding:'18px 0'}}>Nada ainda.</div>}
          {conv.trace.map((t,i) => (
            <div key={i} className={'tr '+t.k}>
              <span className="ic">{t.k==='tool'?'⚙':t.k==='pause'?'⏸':t.k==='block'?'⛔':'✓'}</span>
              <span>
                <span className="nm">{t.nm}</span>
                <span className="dt"> · {t.dt} · {t.hora}</span>
              </span>
            </div>
          ))}
        </div>

        <div className="meters">
          <div className="meter">
            <div className="row"><span>Etapa</span><b>{conv.etapa}</b></div>
            <div className="row" style={{color:'var(--muted)'}}>
              <span>Tools nesta etapa</span>
              <b>{conv.etapa==='aguardando_aprovacao' ? '0 — nenhuma' : conv.etapa==='encerrada' ? '0' : '4'}</b>
            </div>
          </div>
          <div className="meter">
            <div className="row"><span>Custo desta conversa</span><b>{'R$ '+conv.custo.toFixed(3).replace('.',',')}</b></div>
            <div className="bar"><span className={nivel} style={{width:pctCusto+'%'}}/></div>
            <div className="row" style={{color:'var(--muted)',marginTop:3}}>
              <span>Teto por conversa</span><b>R$ 0,450</b>
            </div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className={'btn sm '+(alucinar?'':'ghost')} onClick={()=>setAlucinar(!alucinar)}>
              {alucinar ? '⛔ alucinação armada' : 'Forçar alucinação'}
            </button>
            <button className="btn sm ghost" onClick={reiniciar}><I.volta size={13}/> Recomeçar</button>
          </div>
        </div>
      </aside>
    </div>
  );
};

                </div>
                <div className="preco">{brl(a.preco)}</div>
                <div className="tag mut" style={{alignSelf:'flex-start'}}>sai do estoque por 72h</div>
                <div className="qual">
                  40 km/dia · Manaíra→Centro · carregador em casa<br/>
                  Orçamento informado: até R$ 150 mil · primeiro elétrico
                </div>
                <div className="acts">
                  <button className="btn" onClick={()=>decidir(a.id,'aprovado')}>Aprovar</button>
                  <button className="btn ghost" onClick={()=>decidir(a.id,'rejeitado')}>Recusar</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

/* ── Estoque: a unidade, nunca o SKU ──────────────────────────────────── */
const Estoque = ({estoque, liberar}) => (
  <div className="body-pad">
    <div className="banner">
      <span>⚙</span>
      <span>Cada linha é <b>uma unidade com chassi</b>, não um modelo com quantidade. É por isso
      que reservar é irreversível — e por que <b>preço mora na unidade</b>: dois seminovos do mesmo
      ano têm preços diferentes.
      <br/><br/>
      Para ver a corrida: abra esta página em <b>duas abas</b>, leve as duas até a reserva do mesmo
      chassi e aprove. A segunda recebe “acabou de ser reservado”.
      <button className="btn sm ghost" style={{marginLeft:8}}
        onClick={()=>window.open(window.location.href,'_blank')}>Abrir segunda aba</button>
      </span>
    </div>
    <div className="panel">
      <div className="panel-h"><h3>Unidades no pátio</h3>
        <span className="tag mut">{estoque.filter(u=>u.status==='disponivel').length} disponíveis de {estoque.length}</span>
      </div>
      <div className="tbl-wrap">
        <table>
          <thead><tr>
            <th>Chassi</th><th>Veículo</th><th>Condição</th><th>Autonomia</th>
            <th style={{textAlign:'right'}}>Preço</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>
            {estoque.map(u => (
              <tr key={u.chassi}>
                <td className="num" style={{color:'var(--muted)'}}>{u.chassi}</td>
                <td>
                  <div style={{fontWeight:600}}>{u.marca} {u.modelo}</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>{u.versao} · {u.ano} · {u.cor}</div>
                </td>
                <td>
                  <span className={'tag '+(u.condicao==='novo'?'ok':'mut')}>{u.condicao}</span>
                  {u.condicao==='seminovo' && <div className="num" style={{fontSize:12,color:'var(--muted)',marginTop:3}}>{km(u.km)} km</div>}
                </td>
                <td>
                  <span className="num">{u.aut} km</span>
                  <div><span className={'tag '+(u.fonte==='WLTP'?'warn':'volt')} style={{marginTop:3}}>{u.fonte}</span></div>
                </td>
                <td className="num" style={{textAlign:'right',whiteSpace:'nowrap'}}>{brl(u.preco)}</td>
                <td>
                  <span className={'tag '+(u.status==='disponivel'?'ok':u.status==='reservado'?'warn':'crit')}>
                    {u.status}
                  </span>
                </td>
                <td style={{textAlign:'right'}}>
                  {u.status!=='disponivel' &&
                    <button className="btn sm ghost" onClick={()=>liberar(u.chassi)}>Liberar</button>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
    <p style={{fontSize:12.5,color:'var(--muted)',margin:0}}>
      <b>WLTP</b> é o padrão europeu e é sistematicamente mais otimista que o <b>Inmetro</b>.
      A Aurora nunca compara os dois como se fossem a mesma medida.
    </p>
  </div>
);

/* ── Ler atendimento (o Raí abre e lê) ────────────────────────────────── */
const Auditoria = ({conv, aprovacoes}) => {
  const linhas = [];
  conv.msgs.forEach((m, idx) => {
    if(m.de === 'sys'){ linhas.push({tipo:'sys', t:'', a:'⛔', txt:m.txt}); return; }
    linhas.push({tipo:'msg', t:m.hora, a:m.de==='cliente'?'Tarcísio':'Aurora', txt:m.txt});
    conv.trace.filter(t => t.mi === idx).forEach(tr => {
      linhas.push({tipo: tr.k==='pause'?'hum':'sys', t:'',
        a: tr.k==='pause'?'⏸':tr.k==='block'?'⛔':'⚙', txt: tr.nm+'  ('+tr.dt+')'});
    });
  });
  const dec = aprovacoes.filter(a => a.status !== 'pendente');

  return (
    <div className="body-pad">
      <div className="banner sol">
        <span>👁</span>
        <span>É esta tela que responde ao <b>“se der ruim eu quero abrir a conversa e ler”</b>.
        As linhas <b>⚙</b> mostram onde o número veio de fora do modelo. As <b>⏸</b> mostram
        onde uma pessoa decidiu. Sem elas, é preciso acreditar em mim.</span>
      </div>
      <div className="panel">
        <div className="panel-h">
          <h3>Atendimento · Tarcísio Nóbrega</h3>
          <span className="tag mut">{conv.turnos} turnos · {'R$ '+conv.custo.toFixed(3).replace('.',',')}</span>
        </div>
        <div className="audit">
          {linhas.map((l,i) => (
            <div key={i} className={'arow '+(l.tipo==='sys'?'sys':l.tipo==='hum'?'hum':'')}>
              <span className="t">{l.t}</span>
              <span className="a hide-sm">{l.a}</span>
              <span style={{whiteSpace:'pre-wrap'}}>{l.txt}</span>
            </div>
          ))}
          {dec.map(a => (
            <div key={a.id} className="arow hum">
              <span className="t">{new Date(a.decididoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
              <span className="a hide-sm">⏸</span>
              <span><b>{a.status==='aprovado'?'APROVADO':'RECUSADO'}</b> por Neuza Andrade · chassi {a.chassi} · {brl(a.preco)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ── Custo da IA ──────────────────────────────────────────────────────── */
const Custo = ({conv}) => {
  const mes = 118.40 + conv.custo, teto = 900, pct = (mes/teto)*100;
  const nivel = pct > 80 ? 'crit' : pct > 60 ? 'warn' : '';
  return (
    <div className="body-pad">
      <div className="tiles">
        <div className="tile"><div className="lbl">Gasto de setembro</div>
          <span className="v">{'R$ '+mes.toFixed(2).replace('.',',')}</span>
          <div className="n">{pct.toFixed(0)}% do teto</div></div>
        <div className="tile"><div className="lbl">Teto mensal</div>
          <span className="v">R$ 900</span>
          <div className="n">no teto, a Aurora para e passa para humano</div></div>
        <div className="tile"><div className="lbl">Conversas no mês</div>
          <span className="v">264</span>
          <div className="n">média de R$ 0,45 por conversa</div></div>
        <div className="tile"><div className="lbl">Conversa mais cara</div>
          <span className="v">R$ 1,12</span>
          <div className="n">marcada para revisão semanal</div></div>
      </div>
      <div className="panel">
        <div className="panel-h"><h3>Acumulado contra o teto</h3>
          <span className={'tag '+(nivel==='crit'?'crit':nivel==='warn'?'warn':'ok')}>
            {nivel==='crit'?'crítico':nivel==='warn'?'atenção':'saudável'}</span></div>
        <div style={{padding:'18px 16px'}}>
          <div className="bar" style={{height:11}}><span className={nivel} style={{width:Math.min(100,pct)+'%'}}/></div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontSize:12,color:'var(--muted)'}}>
            <span className="num">R$ 0</span><span className="num">alerta R$ 720</span><span className="num">R$ 900</span>
          </div>
        </div>
      </div>
      <div className="banner">
        <span>⚙</span>
        <span>O custo é o <b>faturado</b>, não estimado: vem do campo <code>usage</code> da resposta
        do provedor. É o número que o Raí paga, e o corte no teto é uma checagem antes de cada
        chamada — não um alerta que chega dia 30.</span>
      </div>
    </div>
  );
};

/* ── Shell ────────────────────────────────────────────────────────────── */
const NAV = {
  cliente:['atendimento'],
  gerente:['fila','atendimento','estoque'],
  dono:['atendimento','fila','estoque','auditoria','custo']
};
const META = {
  atendimento:{ic:'chat',  t:'Atendimento', s:'A conversa e o que o sistema fez, lado a lado'},
  fila:       {ic:'fila',  t:'Aprovações',  s:'O que não tem volta espera aqui'},
  estoque:    {ic:'carro', t:'Estoque',     s:'Unidades com chassi, não SKU com quantidade'},
  auditoria:  {ic:'olho',  t:'Ler atendimento', s:'A conversa inteira, com as consultas e as decisões'},
  custo:      {ic:'cifra', t:'Custo da IA', s:'Quanto custa, e o teto que corta'}
};

const App = () => {
  const [papel, setPapel] = useState(null);
  const [view, setView] = useState('atendimento');
  const [escuro, setEscuro] = useState(() => {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches } catch(e){ return false }
  });
  const [estoque, setEstoque] = useState(() => LS.get('estoque', ESTOQUE_SEED));
  const [aprovacoes, setAprovacoes] = useState(() => LS.get('aprovacoes', []));
  const [conv, setConv] = useState(conversaInicial);
  const [alucinar, setAlucinar] = useState(false);

  useEffect(()=>{ document.documentElement.setAttribute('data-theme', escuro?'dark':'light'); },[escuro]);
  useEffect(()=>{ LS.set('estoque', estoque); },[estoque]);
  useEffect(()=>{ LS.set('aprovacoes', aprovacoes); },[aprovacoes]);

  // Sincroniza entre abas — é o que torna a corrida visível
  useEffect(()=>{
    const h = e => {
      if(e.key === 'evsales:estoque')    setEstoque(LS.get('estoque', ESTOQUE_SEED));
      if(e.key === 'evsales:aprovacoes') setAprovacoes(LS.get('aprovacoes', []));
    };
    window.addEventListener('storage', h);
    return ()=>window.removeEventListener('storage', h);
  },[]);

  // A pausa destravando: a decisão da Neuza é que retoma o fluxo
  useEffect(()=>{
    if(conv.etapa !== 'aguardando_aprovacao' || !conv.chassi) return;
    const a = aprovacoes.find(x => x.chassi === conv.chassi && x.status !== 'pendente');
    if(!a) return;
    if(a.status === 'aprovado'){
      const ok = reservarChassi(conv.chassi, 'Tarcísio Nóbrega');
      setEstoque(LS.get('estoque', ESTOQUE_SEED));
      setConv(c => aplicar(c, ok ? 'reservado' : 'perdeu', null, false));
    } else {
      setConv(c => ({...c, etapa:'humano', chips:[],
        msgs:[...c.msgs,{de:'aurora',hora:agora(),
          txt:'A Neuza precisa falar com você diretamente sobre essa condição. Já passei pro Tarcísio Lima, ele te chama em instantes.'}],
        trace:[...c.trace,{k:'pause',nm:'transferir_para_humano() — a Aurora silencia',dt:'8ms',hora:agora()}]}));
    }
  },[aprovacoes, conv.etapa, conv.chassi]);

  const pedirAprovacao = useCallback((chassi, preco) => {
    setAprovacoes(a => [...a, {id:'AP'+Date.now(), chassi, preco, lead:'Tarcísio N.',
      criadoEm:Date.now(), status:'pendente'}]);
  },[]);

  const decidir = (id, status) =>
    setAprovacoes(a => a.map(x => x.id===id ? {...x, status, decididoEm:Date.now()} : x));

  const liberar = chassi => setEstoque(e => e.map(u =>
    u.chassi===chassi ? {...u, status:'disponivel', para:null} : u));

  const reiniciar = () => {
    setConv(conversaInicial()); setAprovacoes([]); setAlucinar(false);
    setEstoque(ESTOQUE_SEED.map(u => ({...u})));
  };

  if(!papel) return <Gate entrar={p => { setPapel(p); setView(NAV[p][0]); }}/>;

  const pend = aprovacoes.filter(a => a.status==='pendente').length;
  const eu = PAPEIS.find(p => p.id===papel);
  const m = META[view];

  return (
    <div className="shell">
      <nav className="rail">
        <div className="rail-top">
          <div className="brand-mark" style={{width:34,height:34,borderRadius:10,background:'rgba(255,255,255,.1)'}}>
            <I.raio size={18}/>
          </div>
          <div>
            <div className="nm">EV-Sales</div>
            <div className="sub">Sol &amp; Volt · Tambaú</div>
          </div>
        </div>
        <div className="nav">
          {NAV[papel].map(v => {
            const Ico = I[META[v].ic];
            return (
              <button key={v} onClick={()=>setView(v)} aria-current={view===v?'page':undefined}>
                <Ico size={17}/> {META[v].t}
                {v==='fila' && pend>0 && <span className="pill">{pend}</span>}
              </button>
            );
          })}
        </div>
        <div className="rail-foot">
          <button onClick={()=>setEscuro(!escuro)} title="Alternar tema">
            {escuro ? <I.sol size={15}/> : <I.lua size={15}/>} {escuro?'Claro':'Escuro'}
          </button>
          <button onClick={()=>setPapel(null)} title="Trocar de papel">
            <I.sair size={15}/> Sair
          </button>
        </div>
      </nav>

      <main className="main">
        <header className="topbar">
          <div>
            <h2>{m.t}</h2>
            <div className="sub">{m.s}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <span className="tag sol">{eu.o}</span>
            <span style={{fontSize:13,color:'var(--muted)'}}>{eu.quem}</span>
          </div>
        </header>

        {view==='atendimento' && <Atendimento conv={conv} setConv={setConv} estoque={estoque}
          pedirAprovacao={pedirAprovacao} alucinar={alucinar} setAlucinar={setAlucinar} reiniciar={reiniciar}/>}
        {view==='fila'      && <Fila aprovacoes={aprovacoes} decidir={decidir} estoque={estoque}/>}
        {view==='estoque'   && <Estoque estoque={estoque} liberar={liberar}/>}
        {view==='auditoria' && <Auditoria conv={conv} aprovacoes={aprovacoes}/>}
        {view==='custo'     && <Custo conv={conv}/>}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
